min_version = "2026.8.3"

[[hooks.enter]]
shell = "bash"
script = '''
if command -v kinko >/dev/null 2>&1 && kinko hook --help >/dev/null 2>&1; then
  eval "$(kinko --path "$MISE_PROJECT_ROOT" hook enter bash)"
fi
'''

[[hooks.leave]]
shell = "bash"
script = '''
if command -v kinko >/dev/null 2>&1 && kinko hook --help >/dev/null 2>&1; then
  eval "$(kinko hook leave bash)"
fi
'''

[tools]
go = "1.25.4"
bun = "1.4.3"
golangci-lint = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
gitleaks = "latest"
pre-commit = "latest"

[tasks.default]
description = "Show available tasks"
run = "mise tasks ls"

[tasks.build]
description = "Build the binary"
depends = ["web:build"]
run = "go build -o punchflow ./cmd/punchflow"

[tasks."web:install"]
description = "Install web dependencies"
dir = "web"
run = "bun install --frozen-lockfile"

[tasks."web:build"]
description = "Build the web application"
depends = ["web:install"]
dir = "web"
run = "bun run build"

[tasks."web:test"]
description = "Run web tests"
depends = ["web:install"]
dir = "web"
run = "bun test"

[tasks."web:typecheck"]
description = "Typecheck the web application"
depends = ["web:install"]
dir = "web"
run = "bun run typecheck"

[tasks."build:homebrew"]
description = "Build Homebrew release archives"
run = "scripts/build-homebrew-release.sh"

[tasks."homebrew:formula"]
description = "Render the Homebrew formula"
run = "scripts/render-homebrew-formula.sh"

[tasks."homebrew:tap-formula"]
description = "Render the formula into the default sibling tap"
run = '''
if [ "$#" -eq 0 ]; then
  echo "usage: mise run homebrew:tap-formula -- <version>" >&2
  exit 2
fi
scripts/render-homebrew-formula.sh "$1" "../homebrew-tap/Formula/punchflow.rb"
'''

[tasks.run]
description = "Build and run the application"
run = "mise run build && ./punchflow serve"

[tasks.dev]
description = "Build and run the local development server"
depends = ["web:build"]
run = "go run ./cmd/punchflow serve --enable-local-login --enable-admin-reset"

[tasks.test]
description = "Run tests"
run = "go test -count=1 ./... && mise run web:test"

[tasks.test-coverage]
description = "Run tests with coverage"
run = "go test -coverprofile=coverage.out ./... && go tool cover -html=coverage.out -o coverage.html"

[tasks.lint]
description = "Lint and typecheck the project"
run = "golangci-lint run ./... && go vet ./... && mise run web:typecheck"

[tasks."keycloak:up"]
description = "Start local Keycloak"
run = "docker compose -f deploy/keycloak/docker-compose.yml up -d"

[tasks."keycloak:down"]
description = "Stop local Keycloak"
run = "docker compose -f deploy/keycloak/docker-compose.yml down"

[tasks."docker:build"]
description = "Build the container image for the local platform"
run = "docker build -t ${PUNCHFLOW_IMAGE:-tacogips/punchflow}:latest ."

[tasks."docker:push"]
description = "Build and push the multi-arch container image to Docker Hub"
run = '''
image="${PUNCHFLOW_IMAGE:-tacogips/punchflow}"
version="$(cat internal/build/VERSION)"
sha="$(git rev-parse --short HEAD)"
docker buildx build --platform linux/amd64,linux/arm64 \
  -t "$image:latest" -t "$image:$version" -t "$image:sha-$sha" --push .
'''

[tasks.fmt]
description = "Format code"
run = "go fmt ./..."

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.clean]
description = "Clean build artifacts"
run = "rm -f punchflow coverage.out coverage.html"

[tasks.tidy]
description = "Tidy Go modules"
run = "go mod tidy"

[tasks.install-git-hooks]
description = "Install mise tools and the repository pre-commit hook"
run = '''
mise install

hooks_path=$(git config --local --get core.hooksPath || true)
if [ "$hooks_path" = ".git/hooks" ]; then
  git config --local --unset-all core.hooksPath
  hooks_path=""
fi

if [ -z "$hooks_path" ]; then
  mise exec -- pre-commit install
else
  mise exec -- pre-commit validate-config .pre-commit-config.yaml
  echo "Using existing custom Git hooks path: $hooks_path"
fi
'''
